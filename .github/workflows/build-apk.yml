name: Build APK and IPA

on:
  push:
    # dev/* — проверочные сборки без релиза.
    branches: [main, 'dev/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get
      - run: flutter test
      - name: Release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Нет секрета ANDROID_KEYSTORE_BASE64 — APK подписан временным ключом"
          fi
      - run: flutter build apk --release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk Calendar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-apk
          path: Calendar.apk

  ios:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get
      # Без подписи: подписать можно своим Apple ID при установке
      # (Sideloadly / AltStore) или позже сертификатом Apple Developer.
      - run: flutter build ios --release --no-codesign
      - name: Pack IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Calendar-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-ipa
          path: Calendar-unsigned.ipa

  release:
    needs: [android, ios]
    # APK выпускаем, даже если сборка для iOS не удалась.
    if: ${{ always() && needs.android.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Calendar (сборка ${{ github.run_number }})
          files: |
            Calendar.apk
            Calendar-unsigned.ipa
          make_latest: true
          fail_on_unmatched_files: false
